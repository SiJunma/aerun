name: frontend

on:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'eslint.config.js'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Local dev runs Node 24 (see TODO_THEMEABLE_SPRINT_PLAN.md);
          # Vite 7 needs 20.19+ / 22.12+, so 24 is safely inside.
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      # npm test is the whole local chain: the node contract tests, the
      # i18n-keys check, the admin nav/shared-components checks and eslint.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

# No "Publish CI report" step here, unlike backend.yml: the backend job
# force-pushes an orphan ci-report branch holding a single report.json,
# so a second publisher would overwrite its report (and vice versa).
# This job reports through GitHub's native check status instead — the
# failing-run email still arrives. Merging both jobs into one shared
# report would need a schema change; see the ci-report branch notes.
